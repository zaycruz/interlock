name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verified Beads CLI
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          BD_VERSION=1.2.2
          case "$RUNNER_OS-$RUNNER_ARCH" in
            macOS-ARM64) platform=darwin_arm64 ;;
            macOS-X64) platform=darwin_amd64 ;;
            Linux-X64) platform=linux_amd64 ;;
            Linux-ARM64) platform=linux_arm64 ;;
            *) echo "Unsupported runner: $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          archive="beads_${BD_VERSION}_${platform}.tar.gz"
          curl -fsSLO "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/${archive}"
          curl -fsSLO "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/checksums.txt"
          awk -v archive="$archive" '$2 == archive' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          shasum -a 256 -c selected-checksum.txt
          tar xzf "$archive" bd
          mkdir -p "$RUNNER_TEMP/bin"
          mv bd "$RUNNER_TEMP/bin/bd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Run engineering quality gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          TMPDIR: ${{ runner.temp }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          ./scripts/quality-gate --base "$BASE_SHA" --head "$HEAD_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report-${{ matrix.os }}
          path: .engineering/quality-report.json
          if-no-files-found: error

  quality-gate:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both platform gates
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
